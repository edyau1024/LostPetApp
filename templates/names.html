<!DOCTYPE html>
<html>
<head>
    <title>Pets list</title>
</head>
<body>
    <h1>List of pets</h1>

    <ul>
    {% for entry in entries %}
        <li>
            <strong>Pet:</strong> {{ entry.pet_name }}<br>
            <strong>Owner:</strong> {{ entry.owner_name }}<br>
            <strong>Location:</strong> {{ entry.location }}<br>
            {% if entry.image_filename %}
                <img src="{{ entry.image_filename }}" alt="Pet image" style="max-width:300px;"><br>
            {% endif %}
            <form action="{{ url_for('delete_entry', id=entry.id) }}" method="post" style="display:inline;">
    <button type="submit" onclick="return confirm('Are you sure you want to delete this entry?');">Delete</button>
</form>
        </li>
    {% endfor %}
</ul>
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
