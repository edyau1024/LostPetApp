


<!DOCTYPE html>
<html>
<head>
    <title>Submit Pet Name</title>
    
    <!-- Load Maps API with Places and Web Components -->
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key={{ google_api_key }}&libraries=places&v=beta&modules=webcomponents"
    ></script>


</head>
<body>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<style>
  .flashes {
    color: red;
    font-weight: bold;
    list-style-type: none;
    padding: 0;
  }
</style>

    <h1>Submit new pet</h1><br>
    
<form method="POST" enctype="multipart/form-data">
    <label>Pet's Name:</label>
    <input type="text" name="pet_name" required minlength="2"><br>

    <label>Owner's Name:</label>
    <input type="text" name="owner_name" required><br>

    <label>Phone Number:</label>
    <input type="tel" name="phone_number" required><br>
        
    <label>Location Lost:</label>
    <!-- Google Maps Autocomplete Component -->
    <gmp-place-autocomplete
      id="autocomplete"
      input-field-id="location"
      componentRestrictions='{"country": "ca"}'
    ></gmp-place-autocomplete>
    
    <!-- Input field managed by the component -->
    <input id="location" name="location" type="text" placeholder="Enter address" autocomplete="off">
    
    <!-- Hidden fields for backend validation -->
    <input type="hidden" id="place_id" name="place_id">
    <input type="hidden" id="formatted_address" name="formatted_address">
    <p id="selected-address" style="font-weight: bold; color: green;"></p>



<br>
    
    <label>Date Lost:</label>
    <input type="date" name="date_lost" required><br>
    
    <label>Reward ($):</label>
    <input type="number" name="reward" step="0.01" min="0"><br>

    <label>Upload Image:</label>
    <input type="file" name="image"><br>

    <img id="preview" src="#" alt="Image preview" style="display:none; max-width:200px;"><br><br>

<script>
  document.querySelector('input[name="image"]').addEventListener('change', function (e) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const preview = document.getElementById('preview');
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(this.files[0]);
  });
</script>

    
    <button type="submit">Submit</button>

</form>
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>



<script>
  window.addEventListener("DOMContentLoaded", function () {
    const autocompleteEl = document.getElementById("autocomplete");
    const inputEl = document.getElementById("location");
    const placeIdField = document.getElementById("place_id");
    const formattedAddressField = document.getElementById("formatted_address");
    const addressDisplay = document.getElementById("selected-address");

    autocompleteEl.addEventListener("gmp-placeautocomplete-select", (event) => {
      const place = event.detail;
      if (place && place.placeId && place.formattedAddress) {
        placeIdField.value = place.placeId;
        formattedAddressField.value = place.formattedAddress;
        addressDisplay.textContent = "Selected: " + place.formattedAddress;
      } else {
        placeIdField.value = "";
        formattedAddressField.value = "";
        addressDisplay.textContent = "";
        alert("Please select a valid address from the suggestions.");
      }
    });
  });
</script>



    
</html>
