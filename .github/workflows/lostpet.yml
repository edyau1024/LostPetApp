name: LostPet Azure Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
  
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.10'
  
        - name: Install dependencies into antenv
          run: |
            python -m venv antenv
            source antenv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
  
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: python-app
            path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download and extract artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./python-app
  
      - name: List artifact contents
        run: ls -R ./python-app
  
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LostPetApp'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_1234567890abcdef }}
          package: ./python-app
